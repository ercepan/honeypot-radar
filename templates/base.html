<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Honeypot Radar{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129;
    --line: #262d36; --text: #e6edf3; --dim: #8b949e;
    --red: #f85149; --amber: #d29922; --green: #3fb950; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between;
           gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
  .logo span { color: var(--red); }
  .muted { color: var(--dim); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
         color: var(--dim); font-size: 13px; background: var(--panel); }
  .tab.on { color: var(--text); border-color: #3d444d; background: var(--panel2); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px;
       padding: 10px 12px; background: var(--panel2); }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 12px; white-space: nowrap; }
  .honeypot { background: rgba(248,81,73,.15); color: var(--red); }
  .riskli   { background: rgba(210,153,34,.15); color: var(--amber); }
  .temiz    { background: rgba(63,185,80,.15); color: var(--green); }
  .yeni     { background: rgba(88,166,255,.15); color: var(--blue); }
  .bilinmiyor { background: rgba(139,148,158,.15); color: var(--dim); }
  .warn { color: var(--red); font-size: 12px; }
  .copy { cursor: pointer; color: var(--dim); border: 0; background: none;
          font-size: 12px; padding: 0 0 0 6px; }
  .copy:hover { color: var(--text); }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  .back { display: inline-block; margin-bottom: 14px; font-size: 13px; }
  h2 { font-size: 16px; font-weight: 600; margin: 22px 0 10px; }
  .note { background: var(--panel); border: 1px solid var(--line);
          border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0;
          padding: 10px 14px; color: var(--dim); font-size: 13px; margin: 16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo"><a href="/" style="color:inherit">honeypot<span>radar</span></a></div>
      <div class="muted">BSC · PancakeSwap · yeni token'lar otomatik taranır</div>
    </div>
    <div class="muted">{% block headright %}{% endblock %}</div>
  </header>
  {% block body %}{% endblock %}
</div>
<script>
function kopyala(txt, el) {
  navigator.clipboard.writeText(txt).then(function () {
    var o = el.textContent; el.textContent = "kopyalandı";
    setTimeout(function () { el.textContent = o; }, 1200);
  });
}
</script>
</body>
</html>
